server:
  port: 18080

spring:
  config:
    import: optional:application-secret.yml
  application:
    name: feed-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.feedsystem.account.model
  configuration:
    map-underscore-to-camel-case: true

redis:
  key-prefix: "v1:"

feedsystem:
  upload:
    root: .run/uploads

creator-agent:
  base-url: ${CREATOR_AGENT_BASE_URL:http://127.0.0.1:8001}

storage:
  type: minio
  minio:
    endpoint: http://127.0.0.1:19000
    access-key: admin
    secret-key: password123
    bucket: feedsystem
    public-url: http://127.0.0.1:19000
